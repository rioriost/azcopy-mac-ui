name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Release preflight (versions, script regressions, security, tests, coverage)
        run: Scripts/release-preflight.sh
      - name: Dependency inventory (not a vulnerability audit)
        run: swift package show-dependencies --format json > dependencies.json
      - name: Build and verify arm64-only Debug and Release apps
        run: |
          for configuration in Debug Release; do
            xcodebuild -project AzCopyMacUI.xcodeproj -scheme AzCopyMacUI \
              -configuration "$configuration" -destination 'generic/platform=macOS' \
              -derivedDataPath .build/ci-app \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
            python3 Scripts/check-release-app.py \
              ".build/ci-app/Build/Products/$configuration/AzCopy Mac UI.app"
          done
