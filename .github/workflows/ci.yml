name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Release preflight (versions, script regressions, security, tests, coverage)
        run: Scripts/release-preflight.sh
      - name: Dependency inventory (not a vulnerability audit)
        run: swift package show-dependencies --format json > dependencies.json
      - name: Build arm64 app without signing
        run: >-
          xcodebuild -project AzCopyMacUI.xcodeproj -scheme AzCopyMacUI
          -configuration Release -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 build
